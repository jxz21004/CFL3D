[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfl3d-wrapper"
version = "0.2.0"
description = "Native f2py interface and Python CGNS reader for CFL3D V6"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
build = ["meson>=1.3", "ninja"]
mpi = ["mpi4py>=4.0"]
hdf5 = ["h5py>=3.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cfl3d", "cfl3d.*"]
namespaces = false
